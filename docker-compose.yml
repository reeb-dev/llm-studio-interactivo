services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: llmstudio
      POSTGRES_USER: llmstudio
      POSTGRES_PASSWORD: llmstudio
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmstudio -d llmstudio"]
      interval: 5s
      timeout: 5s
      retries: 15
    volumes:
      - llmstudio-postgres:/var/lib/postgresql/data

volumes:
  llmstudio-postgres:
