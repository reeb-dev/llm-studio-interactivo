spring:
  application:
    name: llm-studio-api
  datasource:
    url: jdbc:h2:mem:llmstudio;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  h2:
    console:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  security:
    enabled: false
