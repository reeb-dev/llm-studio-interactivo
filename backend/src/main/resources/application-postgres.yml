spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/llmstudio}
    username: ${DATABASE_USER:llmstudio}
    password: ${DATABASE_PASSWORD:llmstudio}
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  security:
    enabled: true

spring.security:
  oauth2:
    resourceserver:
      jwt:
        issuer-uri: ${JWT_ISSUER_URI}
